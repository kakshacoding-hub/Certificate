<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Find your certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --bg:#FFFFFF; --ink:#16203A; --muted:#5B6685;
    --line:#C9D1E3; --accent:#1F3FD6; --accent-ink:#FFFFFF; --err:#B3261E;
  }
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--bg)}
  body{
    color:var(--ink);
    font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.5; min-height:100vh;
  }
  main{
    max-width:1000px; margin:0 auto; padding:48px 16px 64px;
    display:flex; flex-direction:column;
  }
  h1{
    font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
    font-weight:700; font-size:clamp(2.2rem,6vw,3.4rem); line-height:1.05;
    letter-spacing:-.02em; margin:0 0 14px; max-width:14ch;
  }
  .lede{color:var(--muted); font-size:1.05rem; margin:0 0 28px; max-width:46ch}
  form{display:flex; gap:10px; flex-wrap:wrap}
  input[type=text]{
    flex:1 1 260px; min-width:0; font:inherit; font-size:1.1rem;
    padding:15px 18px; border:2px solid var(--line); border-radius:10px;
    background:#fff; color:var(--ink);
  }
  input[type=text]:focus-visible,button:focus-visible,a:focus-visible{
    outline:3px solid var(--accent); outline-offset:2px;
  }
  button,.btn{
    font:inherit; font-weight:500; cursor:pointer; text-decoration:none;
    padding:15px 26px; border-radius:10px; border:2px solid var(--accent);
    background:var(--accent); color:var(--accent-ink);
    display:inline-flex; align-items:center; justify-content:center;
  }
  .btn.ghost{background:transparent; color:var(--accent)}
  #status{min-height:1.5em; margin:16px 0 0; color:var(--muted)}
  #status.error{color:var(--err)}

  /* Certificate sits at the very top, white page, full width */
  #result{display:none; order:-1}
  #result.show{display:block}
  .sheet img{display:block; width:100%; height:auto}
  .sheet{background:#fff}
  .sheet canvas{display:block; width:100%; height:auto; background:#fff}
  .sheet .fallback{padding:24px 0; color:var(--muted)}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 28px}
  .actions .btn{padding:12px 20px}

  /* Once a certificate is found, drop the intro and pull it to the top */
  body.found main{padding-top:0}
  body.found h1, body.found .lede{display:none}
  body.found form{margin-top:4px}
  body.found input[type=text]{padding:11px 14px; font-size:1rem}
  body.found form button{padding:11px 20px}
</style>
</head>
<body>
<main>
  <h1>Find your certificate</h1>
  <p class="lede">Type your full name exactly as it was registered. If it matches, your certificate opens right here.</p>

  <form id="f" autocomplete="off">
    <input id="name" type="text" placeholder="Full name" aria-label="Full name" required>
    <button type="submit">Show certificate</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" aria-label="Certificate">
    <div class="sheet" id="sheet"></div>
    <div class="actions">
      <a class="btn" id="dl" download>Download</a>
      <a class="btn ghost" id="open" target="_blank" rel="noopener">Open in new tab</a>
    </div>
  </section>
</main>

<script>
  const FOLDER = "/certificates";
  const EXTENSIONS = ["pdf", "png", "jpg", "jpeg", "webp"];

  const $ = id => document.getElementById(id);
  const form = $("f"), input = $("name"), statusEl = $("status"),
        result = $("result"), sheet = $("sheet");

  function slugify(s){
    return s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  async function exists(url){
    try{
      const r = await fetch(url, {cache:"no-store"});
      if(!r.ok) return false;
      const type = (r.headers.get("content-type") || "").toLowerCase();
      return !type.includes("text/html");
    }catch(e){ return false; }
  }

  async function findCertificate(rawName){
    const slug = slugify(rawName);
    if(!slug) return null;
    const bases = [slug, slug.replace(/-/g, "_"), slug.replace(/-/g, "")];
    for(const base of bases){
      for(const ext of EXTENSIONS){
        const url = `${FOLDER}/${encodeURIComponent(base)}.${ext}`;
        if(await exists(url)) return {url, ext, base};
      }
    }
    return null;
  }

  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
  const PDFJS_WORKER = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  function loadPdfJs(){
    return new Promise((resolve, reject) => {
      if(window.pdfjsLib) return resolve(window.pdfjsLib);
      const t = document.createElement("script");
      t.src = PDFJS;
      t.onload = () => {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        resolve(window.pdfjsLib);
      };
      t.onerror = reject;
      document.head.appendChild(t);
    });
  }

  // Draw every PDF page on a white canvas, full width, starting at the top
  async function renderPdf(url){
    const lib = await loadPdfJs();
    const pdf = await lib.getDocument(url).promise;
    const width = sheet.clientWidth || document.documentElement.clientWidth;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    for(let n = 1; n <= pdf.numPages; n++){
      const page = await pdf.getPage(n);
      const base = page.getViewport({scale:1});
      const vp = page.getViewport({scale:(width / base.width) * dpr});
      const c = document.createElement("canvas");
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      sheet.appendChild(c);
      await page.render({canvasContext:ctx, viewport:vp}).promise;
    }
  }

  function setStatus(msg, isError){
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
  }

  async function search(name){
    result.classList.remove("show");
    document.body.classList.remove("found");
    sheet.innerHTML = "";
    setStatus("Searching…");
    const found = await findCertificate(name);
    if(!found){
      setStatus("No certificate found for “" + name.trim() + "”. Check the spelling and try your full name.", true);
      return;
    }
    setStatus("");
    result.classList.add("show");
    document.body.classList.add("found");
    if(found.ext === "pdf"){
      try{
        await renderPdf(found.url);
      }catch(e){
        sheet.innerHTML = '<p class="fallback">Preview could not load. Use Open in new tab or Download below.</p>';
      }
    }else{
      const i = document.createElement("img");
      i.src = found.url; i.alt = "Certificate of " + name.trim();
      sheet.appendChild(i);
    }
    $("dl").href = found.url;
    $("dl").setAttribute("download", found.base + "." + found.ext);
    $("open").href = found.url;
    window.scrollTo(0, 0);
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value;
    if(!v.trim()) return;
    history.replaceState(null, "", "?name=" + encodeURIComponent(v.trim()));
    search(v);
  });

  // Works with ?name=Nitish%20Kumar and with a clean link like /nitish-kumar
  const seg = decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g, ""));
  const fromPath = (seg && !seg.includes("/") && !seg.includes(".")) ? seg.replace(/[-_]+/g, " ") : "";
  const q = new URLSearchParams(location.search).get("name") || fromPath;
  if(q){ input.value = q; search(q); }
</script>
</body>
</html>
