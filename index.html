<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find your certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E9EDF5; --panel:#FFFFFF; --ink:#16203A; --muted:#5B6685;
    --line:#C9D1E3; --accent:#1F3FD6; --accent-ink:#FFFFFF; --err:#B3261E;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10152A; --panel:#182041; --ink:#EAEEFB; --muted:#9AA6CC;
      --line:#2D3868; --accent:#7C95FF; --accent-ink:#0E1430; --err:#FF8A80; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.5; min-height:100vh;
  }
  main{max-width:880px; margin:0 auto; padding:56px 20px 80px}
  h1{
    font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
    font-weight:700; font-size:clamp(2.2rem,6vw,3.6rem); line-height:1.05;
    letter-spacing:-.02em; margin:0 0 14px; max-width:14ch;
  }
  .lede{color:var(--muted); font-size:1.05rem; margin:0 0 32px; max-width:46ch}
  form{display:flex; gap:10px; flex-wrap:wrap}
  input[type=text]{
    flex:1 1 260px; min-width:0; font:inherit; font-size:1.1rem;
    padding:16px 18px; border:2px solid var(--line); border-radius:10px;
    background:var(--panel); color:var(--ink);
  }
  input[type=text]:focus-visible,button:focus-visible,a:focus-visible{
    outline:3px solid var(--accent); outline-offset:2px;
  }
  button, .btn{
    font:inherit; font-weight:500; cursor:pointer; text-decoration:none;
    padding:16px 26px; border-radius:10px; border:2px solid var(--accent);
    background:var(--accent); color:var(--accent-ink);
    display:inline-flex; align-items:center; justify-content:center;
  }
  .btn.ghost{background:transparent; color:var(--accent)}
  #status{min-height:1.5em; margin:18px 0 0; color:var(--muted)}
  #status.error{color:var(--err)}
  #result{margin-top:28px; display:none}
  #result.show{display:block}
  .sheet{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px; overflow:hidden;
  }
  .sheet img{display:block; width:100%; height:auto; border-radius:6px}
  .sheet iframe{display:block; width:100%; height:min(80vh,720px); border:0; border-radius:6px; background:#fff}
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
  .actions .btn{padding:12px 20px}
  .who{font-family:"Bricolage Grotesque",system-ui,sans-serif; font-size:1.3rem; font-weight:500; margin:0 0 12px; text-transform:capitalize}
  @media (prefers-reduced-motion:no-preference){
    #result.show .sheet{animation:rise .35s ease-out}
    @keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
  }
</style>
</head>
<body>
<main>
  <h1>Find your certificate</h1>
  <p class="lede">Type your full name exactly as it was registered. If it matches, your certificate opens right here.</p>

  <form id="f" autocomplete="off">
    <input id="name" type="text" placeholder="Full name" aria-label="Full name" required>
    <button type="submit">Show certificate</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>

  <section id="result" aria-label="Certificate">
    <p class="who" id="who"></p>
    <div class="sheet" id="sheet"></div>
    <div class="actions">
      <a class="btn" id="dl" download>Download</a>
      <a class="btn ghost" id="open" target="_blank" rel="noopener">Open in new tab</a>
    </div>
  </section>
</main>

<script>
  // Folder where certificate files live
  const FOLDER = "certificates";
  // File types the site will look for, in this order
  const EXTENSIONS = ["pdf", "png", "jpg", "jpeg", "webp"];

  const $ = id => document.getElementById(id);
  const form = $("f"), input = $("name"), statusEl = $("status"),
        result = $("result"), sheet = $("sheet");

  // "Aditya  Pandey" -> "aditya-pandey"
  function slugify(s){
    return s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
  }

  async function exists(url){
    try{
      const r = await fetch(url, {method:"GET", cache:"no-store"});
      if(!r.ok) return false;
      const type = (r.headers.get("content-type") || "").toLowerCase();
      return !type.includes("text/html");
    }catch(e){ return false; }
  }

  async function findCertificate(rawName){
    const slug = slugify(rawName);
    if(!slug) return null;
    const bases = [slug, slug.replace(/-/g, "_"), slug.replace(/-/g, "")];
    for(const base of bases){
      for(const ext of EXTENSIONS){
        const url = `${FOLDER}/${encodeURIComponent(base)}.${ext}`;
        if(await exists(url)) return {url, ext, base};
      }
    }
    return null;
  }

  function setStatus(msg, isError){
    statusEl.textContent = msg;
    statusEl.className = isError ? "error" : "";
  }

  async function search(name){
    result.classList.remove("show");
    sheet.innerHTML = "";
    setStatus("Searching…");
    const found = await findCertificate(name);
    if(!found){
      setStatus("No certificate found for “" + name.trim() + "”. Check the spelling and try your full name.", true);
      return;
    }
    setStatus("");
    $("who").textContent = name.trim();
    if(found.ext === "pdf"){
      const f = document.createElement("iframe");
      f.src = found.url; f.title = "Certificate of " + name.trim();
      sheet.appendChild(f);
    }else{
      const i = document.createElement("img");
      i.src = found.url; i.alt = "Certificate of " + name.trim();
      sheet.appendChild(i);
    }
    $("dl").href = found.url;
    $("dl").setAttribute("download", found.base + "." + found.ext);
    $("open").href = found.url;
    result.classList.add("show");
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value;
    if(!v.trim()) return;
    history.replaceState(null, "", "?name=" + encodeURIComponent(v.trim()));
    search(v);
  });

  // Shareable link: yoursite.vercel.app/?name=Aditya%20Pandey
  const q = new URLSearchParams(location.search).get("name");
  if(q){ input.value = q; search(q); }
</script>
</body>
</html>
